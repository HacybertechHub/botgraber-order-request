<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HGT-CORE | NEXUS UNIFIED TERMINAL</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #020617; 
            --card-bg: rgba(13, 18, 31, 0.9); 
            --accent: #00ffcc; 
            --danger: #ff3b6a;
            --text-soft: #94a3b8; 
            --border-glow: rgba(0, 255, 204, 0.3);
            --font-mono: "JetBrains Mono", "Courier New", monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg-main); 
            background-image: radial-gradient(circle at top, #07111f 0, #020308 55%, #000 100%);
            font-family: var(--font-mono); 
            color: white; 
            min-height: 100vh; 
            overflow-x: hidden;
        }

        /* UI SHELL */
        nav { 
            width: 100%; 
            padding: 1rem 5%; 
            background: rgba(8, 11, 20, 0.9); 
            backdrop-filter: blur(15px); 
            border-bottom: 2px solid var(--accent); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; top: 0; z-index: 100;
        }

        .container { width: 95%; max-width: 1100px; margin: 40px auto; }

        /* TAB SYSTEM */
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { 
            background: rgba(0, 255, 204, 0.05); border: 1px solid var(--border-glow);
            color: var(--text-soft); padding: 10px 20px; cursor: pointer; font-size: 12px;
            text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .tab-btn.active { background: var(--accent); color: #000; font-weight: bold; }

        /* PANELS */
        .grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

        .card { 
            background: var(--card-bg); border: 1px solid var(--border-glow);
            padding: 25px; border-radius: 4px; position: relative;
        }

        .log-window {
            height: 200px; background: #000; border: 1px solid #1e293b;
            padding: 10px; font-size: 11px; color: var(--accent);
            overflow-y: auto; margin-top: 10px;
        }

        /* FORM ELEMENTS */
        label { display: block; font-size: 10px; color: var(--accent); margin: 15px 0 5px; text-transform: uppercase; }
        input, select, textarea { 
            width: 100%; padding: 12px; background: rgba(0,0,0,0.5);
            border: 1px solid #1e293b; color: var(--accent); font-family: var(--font-mono);
        }
        .btn-prime {
            width: 100%; padding: 15px; margin-top: 20px; background: transparent;
            border: 2px solid var(--accent); color: var(--accent); cursor: pointer;
            font-weight: bold; text-transform: uppercase; transition: 0.3s;
        }
        .btn-prime:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        /* STATUSES */
        .status-pill { font-size: 10px; padding: 4px 8px; border: 1px solid var(--accent); color: var(--accent); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 12px; height: 12px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent);"></div>
            <span style="font-weight: 900; letter-spacing: 2px;">HACYBER GLOBALTECH</span>
        </div>
        <div class="status-pill">CORE_ENCRYPTED_V3.0</div>
    </nav>

    <div class="container">
        <!-- NAVIGATION -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('intake')">01. Order Intake</button>
            <button class="tab-btn" id="botTab" onclick="switchTab('bot')">02. Activation Bot [LOCKED]</button>
        </div>

        <div class="grid">
            <!-- MAIN CONTENT AREA -->
            <div class="main-panel">
                
                <!-- SECTION 1: INTAKE -->
                <div id="section-intake" class="card">
                    <h2 style="color: var(--accent); margin-bottom: 5px;">NEXUS ORDER INTAKE</h2>
                    <p style="font-size: 11px; color: var(--text-soft); margin-bottom: 20px;">[PROTOCOL: SECURE_DATA_COLLECTION]</p>
                    
                    <form id="orderForm">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                            <div>
                                <label>Identity_Name</label>
                                <input type="text" id="fullName" placeholder="FULL NAME" required />
                            </div>
                            <div>
                                <label>Order_ID</label>
                                <input type="text" id="systemId" placeholder="HGT-001" required />
                            </div>
                        </div>

                        <label>Deployment_Plan</label>
                        <select id="plan">
                            <option value="Elite Activation ($130.00)">Elite Activation ($130.00)</option>
                            <option value="Enterprise Nexus ($199.99)">Enterprise Nexus ($199.99)</option>
                            <option value="Starter Core ($91.99)">Starter Core ($91.99)</option>
                        </select>

                        <label>Encrypted_Email</label>
                        <input type="email" id="email" placeholder="CLIENT@HACYBER.TECH" required />

                        <button type="submit" class="btn-prime">Execute Submission & Unlock Bot</button>
                    </form>
                </div>

                <!-- SECTION 2: BOT (HIDDEN UNTIL SUBMITTED) -->
                <div id="section-bot" class="card hidden">
                    <h2 style="color: var(--accent); margin-bottom: 5px;">PRIME ACTIVATION BOT</h2>
                    <p style="font-size: 11px; color: var(--text-soft); margin-bottom: 20px;">[IDENTITY: HGT-PRIME-HYBRID]</p>
                    
                    <label>Target Platform</label>
                    <select id="platform">
                        <option value="TG">Telegram Channel</option>
                        <option value="WA">WhatsApp Business</option>
                        <option value="DS">Discord Node</option>
                    </select>

                    <button class="btn-prime" onclick="generateKey()">Generate Hybrid Key</button>
                    
                    <div id="keyDisplay" style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.4); border: 1px dashed var(--accent); text-align: center; display: none;">
                        <span id="keyValue" style="font-size: 18px; color: var(--accent); font-weight: bold; letter-spacing: 3px;"></span>
                    </div>
                </div>
            </div>

            <!-- SIDEBAR: LOGS & STATUS -->
            <div class="side-panel">
                <div class="card" style="height: 100%;">
                    <h3 style="font-size: 12px; color: var(--accent);">SYSTEM_LOGS</h3>
                    <div id="logWindow" class="log-window">
                        <div>> [PRIME] System Initialized...</div>
                        <div>> [PRIME] Ready for handshake...</div>
                    </div>
                    
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #1e293b;">
                        <h3 style="font-size: 12px; color: var(--accent); margin-bottom: 10px;">DIRECT_ACCESS</h3>
                        <a href="https://wa.me/13609552434" style="color: var(--text-soft); font-size: 11px; text-decoration: none; display: block; margin-bottom: 5px;">> WhatsApp_Secure</a>
                        <a href="https://t.me/hacyberglobaltech" style="color: var(--text-soft); font-size: 11px; text-decoration: none; display: block;">> Telegram_Node</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function log(msg) {
            const win = document.getElementById('logWindow');
            const entry = document.createElement('div');
            entry.textContent = `> ${msg}`;
            win.appendChild(entry);
            win.scrollTop = win.scrollHeight;
        }

        function switchTab(tab) {
            if (tab === 'bot' && document.getElementById('botTab').innerText.includes('LOCKED')) {
                log('ACCESS DENIED: Submit order first.');
                return;
            }
            document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
            document.getElementById('section-' + tab).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.getElementById('orderForm').addEventListener('submit', (e) => {
            e.preventDefault();
            log('INITIALIZING HANDSHAKE...');
            log('DATA_ENCRYPTED: ' + document.getElementById('fullName').value);
            
            setTimeout(() => {
                log('ACCESS GRANTED: PRIME BOT UNLOCKED.');
                document.getElementById('botTab').innerText = '02. Activation Bot';
                document.getElementById('botTab').style.color = 'var(--accent)';
                alert('Handshake Successful. Prime Bot is now online.');
            }, 1000);
        });

        function generateKey() {
            const platform = document.getElementById('platform').value;
            const key = "HGT-" + platform + "-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById('keyDisplay').style.display = 'block';
            document.getElementById('keyValue').innerText = key;
            log(`KEY_GENERATED for ${platform}: ${key}`);
        }
    </script>
</body>
</html>
